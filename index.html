<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bradbury Cabin</title><link rel="stylesheet" href="app.css"><meta name="theme-color" content="#261f24"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Bradbury Cabin"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icon-180.png"></head><body>
<main id="space" data-structure="a" data-mode="day" aria-label="Bradbury Cabin">
<div class="colour-field" aria-hidden="true"></div><div id="pieces"></div>
<div class="status simulated-status" aria-hidden="true"><span id="clock">9:41</span><span class="island"></span><span class="signal">••• ▰</span></div>
<div id="chooser-ui"><span class="counter glass" id="counter">1 of 3</span><button class="collection-button glass" id="collections" aria-label="Open Shelf and Library"><svg viewBox="0 0 24 24"><path d="M5 4v15m5-13v13m4-15 5 14M3 21h18"/></svg></button><div class="dots" aria-hidden="true"><i></i><i></i><i></i></div><div class="gesture-hint" id="hint">Swipe to choose · Pull up to read</div></div>

<div id="intro" aria-label="A brief arrival moment"><img id="intro-art" alt=""><div class="intro-shade"></div><div class="intro-copy"><span>Bradbury Cabin</span><h1>A little time,<br>just for you.</h1></div></div>
